<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LT Tournament V1 2027 — Scorecard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
.app{max-width:1200px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 16px 16px;border-bottom:1px solid #1e2530}
header h1{font-size:clamp(18px,4vw,28px);font-weight:700;color:#fff;letter-spacing:1px}
header p{font-size:13px;color:#64748b;margin-top:4px}
.selector-wrap{padding:20px 0 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.selector-wrap label{font-size:13px;color:#94a3b8;font-weight:600;letter-spacing:.5px}
select{background:#1e2530;color:#e2e8f0;border:1px solid #2d3748;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;min-width:200px;outline:none}
select:focus{border-color:#3b82f6}
.match-hero{background:#1a1f2e;border:1px solid #1e2530;border-radius:12px;padding:20px;margin-bottom:20px}
.match-hero-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.venue-badge{font-size:11px;color:#3b82f6;background:#1e3a5f;padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.5px}
.match-date{font-size:12px;color:#64748b}
.teams-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0;flex-wrap:wrap}
.team-block{text-align:center;flex:1;min-width:120px}
.team-name{font-size:clamp(14px,3vw,20px);font-weight:700;color:#fff}
.team-score{font-size:clamp(20px,5vw,36px);font-weight:800;color:#3b82f6}
.team-score.chasing{color:#10b981}
.vs-block{font-size:18px;color:#475569;font-weight:700}
.result-banner{text-align:center;padding:10px;background:#14532d;border-radius:8px;color:#86efac;font-size:14px;font-weight:600;margin-top:12px}
.toss-line{font-size:12px;color:#94a3b8;text-align:center;margin-top:8px}
.section-title{font-size:13px;font-weight:700;color:#94a3b8;letter-spacing:.8px;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:#1e2530}
.p11-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.p11-card{background:#1a1f2e;border:1px solid #1e2530;border-radius:10px;overflow:hidden}
.p11-card-head{background:#1e3a5f;padding:10px 14px;font-size:12px;font-weight:700;color:#93c5fd;letter-spacing:.5px}
.p11-list{list-style:none;padding:0}
.p11-list li{padding:7px 14px;font-size:13px;color:#cbd5e1;border-bottom:1px solid #1e2530;display:flex;align-items:center;gap:8px}
.p11-list li:last-child{border-bottom:none}
.p11-num{font-size:11px;color:#475569;min-width:18px}
.bowler-badge{font-size:10px;background:#1e3a5f;color:#93c5fd;padding:2px 6px;border-radius:4px;margin-left:auto}
.innings-tabs{display:flex;gap:4px;margin-bottom:0}
.inn-tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #1e2530;background:#141920;color:#64748b;transition:all .2s;white-space:nowrap}
.inn-tab.active{background:#1e3a5f;color:#93c5fd;border-bottom-color:#1e3a5f}
.innings-block{background:#1a1f2e;border:1px solid #1e2530;border-radius:0 10px 10px 10px;padding:16px;margin-bottom:20px}
.innings-summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.inn-team{font-size:15px;font-weight:700;color:#fff}
.inn-score-big{font-size:24px;font-weight:800;color:#3b82f6;margin-left:auto}
.over-accordion{border:1px solid #1e2530;border-radius:8px;overflow:hidden;margin-bottom:6px}
.over-header{display:flex;align-items:center;padding:10px 14px;cursor:pointer;background:#141920;gap:10px;user-select:none}
.over-header:hover{background:#1a2030}
.over-num{font-size:12px;font-weight:700;color:#3b82f6;min-width:60px}
.over-runs{font-size:13px;font-weight:600;color:#e2e8f0}
.over-bowler{font-size:12px;color:#64748b;flex:1}
.over-extras-info{font-size:11px;color:#f59e0b}
.over-wkts{font-size:11px;color:#ef4444;margin-left:4px}
.chevron{font-size:12px;color:#475569;transition:transform .2s;margin-left:auto}
.over-header.open .chevron{transform:rotate(180deg)}
.balls-table-wrap{overflow-x:auto}
.balls-table{width:100%;border-collapse:collapse;font-size:12px}
.balls-table th{background:#0f1420;color:#64748b;font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid #1e2530;white-space:nowrap}
.balls-table td{padding:7px 10px;border-bottom:1px solid #141920;color:#cbd5e1;white-space:nowrap}
.balls-table tr:last-child td{border-bottom:none}
.balls-table tr.wicket-row td{background:#2d1515}
.balls-table tr.noball-row td{background:#2d1f0f}
.balls-table tr.wide-row td{background:#1f1a2d}
.balls-table tr.freehit-row td{background:#1f2a0f}
.balls-table tr.normal-row:hover td{background:#1e2530}
.run-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-weight:700;font-size:11px}
.run-0{background:#1e2530;color:#64748b}
.run-1{background:#1e3a5f;color:#93c5fd}
.run-2{background:#1e3a5f;color:#93c5fd}
.run-3{background:#2d1f5e;color:#c4b5fd}
.run-4{background:#1e3a5f;color:#60a5fa;outline:2px solid #3b82f6}
.run-6{background:#2d1052;color:#a78bfa;outline:2px solid #7c3aed}
.run-w{background:#7f1d1d;color:#fca5a5;outline:2px solid #ef4444}
.fh-tag{background:#14532d;color:#86efac;font-size:10px;padding:1px 5px;border-radius:4px;font-weight:600}
.wk-tag{background:#7f1d1d;color:#fca5a5;font-size:11px;padding:2px 6px;border-radius:4px}
.nb-tag{background:#78350f;color:#fcd34d;font-size:11px;padding:2px 7px;border-radius:4px;font-weight:700}
.wd-tag{background:#2d1f5e;color:#c4b5fd;font-size:11px;padding:2px 7px;border-radius:4px;font-weight:700}
.sc-reason{font-size:11px;color:#64748b;font-style:italic}
.oc-reason{font-size:11px;color:#3b82f6}
.target-banner{background:#0c2a1a;border:1px solid #166534;border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.target-label{font-size:12px;color:#4ade80;font-weight:700}
.target-num{font-size:22px;font-weight:800;color:#22c55e}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px;font-size:11px}
.leg-item{display:flex;align-items:center;gap:5px;color:#64748b}
.leg-dot{width:10px;height:10px;border-radius:2px}
.stats-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.stat-item{font-size:12px;color:#64748b}
.stat-item b{color:#e2e8f0}
.placeholder{text-align:center;padding:60px 20px;color:#475569}
.placeholder-icon{font-size:48px;margin-bottom:12px}
@media(max-width:640px){
  .p11-grid{grid-template-columns:1fr}
  .teams-row{gap:8px}
  .selector-wrap{flex-direction:column;align-items:flex-start}
  select{width:100%}
  .balls-table th,.balls-table td{padding:5px 7px;font-size:11px}
  .inn-tab{font-size:11px;padding:6px 10px}
}
</style>
</head>

const MATCHES={};
RAW.forEach(m=>{MATCHES[m.venue]=m;});
const venueSelect=document.getElementById('venueSelect');
Object.keys(MATCHES).sort().forEach(v=>{
  const o=document.createElement('option');
  o.value=v;
  o.textContent=v+' — '+MATCHES[v].team1+' vs '+MATCHES[v].team2;
  venueSelect.appendChild(o);
});
let currentInn=1;
let openOvers={};

function loadMatch(){
  const venue=venueSelect.value;
  if(!venue)return;
  currentInn=1;openOvers={};
  renderMatch(MATCHES[venue]);
}

function renderMatch(m){
  document.getElementById('matchContent').innerHTML=
    renderHero(m)+renderPlaying11(m)+renderInningsSection(m);
}

function renderHero(m){
  return`<div class="match-hero">
    <div class="match-hero-top">
      <span class="venue-badge">📍 ${m.venue}</span>
      <span class="match-date">📅 ${m.date} &nbsp;⏰ ${m.time}</span>
    </div>
    <div class="teams-row">
      <div class="team-block">
        <div class="team-name">${m.batting_first}</div>
        <div class="team-score">${m.inn1_runs}/${m.inn1_wkts}</div>
        <div style="font-size:11px;color:#64748b">Batting First</div>
      </div>
      <div class="vs-block">VS</div>
      <div class="team-block">
        <div class="team-name">${m.bowling_first}</div>
        <div class="team-score chasing">${m.inn2_runs}/${m.inn2_wkts}</div>
        <div style="font-size:11px;color:#64748b">Chasing (Target: ${m.target})</div>
      </div>
    </div>
    <div class="result-banner">🏆 ${m.result}</div>
    <div class="toss-line">🪙 Toss: <b>${m.toss_winner}</b> won and elected to <b>${m.toss_choice}</b> first</div>
  </div>`;
}

function renderPlaying11(m){
  const bowlers1=new Set(m.inn1.filter(b=>b.t==='normal'||b.t==='noball').map(b=>b.bw));
  const bowlers2=new Set(m.inn2.filter(b=>b.t==='normal'||b.t==='noball').map(b=>b.bw));
  function rows(players,bset){
    return players.map((p,i)=>
      `<li class="p11-list"><span class="p11-num">${i+1}</span>${p}${bset.has(p)?'<span class="bowler-badge">BWL</span>':''}</li>`
    ).join('');
  }
  return`<div class="section-title">Playing 11</div>
  <div class="p11-grid">
    <div class="p11-card">
      <div class="p11-card-head">🏏 ${m.batting_first} — Batting First</div>
      <ul class="p11-list">${rows(m.p11_batting,bowlers2)}</ul>
    </div>
    <div class="p11-card">
      <div class="p11-card-head">🎯 ${m.bowling_first} — Bowling First</div>
      <ul class="p11-list">${rows(m.p11_bowling,bowlers1)}</ul>
    </div>
  </div>`;
}

function renderInningsSection(m){
  return`<div class="section-title">Scorecard</div>
  <div class="innings-tabs">
    <div class="inn-tab ${currentInn===1?'active':''}" onclick="switchInn(1)">
      Inn 1 — ${m.batting_first} (${m.inn1_runs}/${m.inn1_wkts})
    </div>
    <div class="inn-tab ${currentInn===2?'active':''}" onclick="switchInn(2)">
      Inn 2 — ${m.bowling_first} (${m.inn2_runs}/${m.inn2_wkts})
    </div>
  </div>
  <div id="innBlock">${renderInningsBlock(m,currentInn)}</div>`;
}

function switchInn(n){
  currentInn=n;
  const m=MATCHES[venueSelect.value];
  document.querySelectorAll('.inn-tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));
  document.getElementById('innBlock').innerHTML=renderInningsBlock(m,n);
}

function groupByOver(balls){
  const overs={};
  balls.forEach(b=>{if(!overs[b.o])overs[b.o]=[];overs[b.o].push(b);});
  return overs;
}

function renderInningsBlock(m,innNum){
  const balls=innNum===1?m.inn1:m.inn2;
  const teamName=innNum===1?m.batting_first:m.bowling_first;
  const runs=innNum===1?m.inn1_runs:m.inn2_runs;
  const wkts=innNum===1?m.inn1_wkts:m.inn2_wkts;
  const overs=groupByOver(balls);
  const overNums=Object.keys(overs).map(Number).sort((a,b)=>a-b);
  const extras=balls.filter(b=>b.ex).length;
  const fours=balls.filter(b=>b.br===4).length;
  const sixes=balls.filter(b=>b.br===6).length;
  const wides=balls.filter(b=>b.t==='wide').length;
  const noballs=balls.filter(b=>b.t==='noball').length;

  const targetBanner=innNum===2?`<div class="target-banner">
    <span class="target-label">TARGET</span>
    <span class="target-num">${m.target}</span>
    <span style="font-size:12px;color:#4ade80">Need ${m.target} in 20 overs</span>
  </div>`:'';

  const legend=`<div class="legend">
    <span class="leg-item"><span class="leg-dot" style="background:#2d1515"></span>Wicket</span>
    <span class="leg-item"><span class="leg-dot" style="background:#2d1f0f"></span>No Ball</span>
    <span class="leg-item"><span class="leg-dot" style="background:#1f1a2d"></span>Wide</span>
    <span class="leg-item"><span class="leg-dot" style="background:#1f2a0f"></span>Free Hit</span>
    <span class="leg-item"><span class="run-badge run-4" style="width:14px;height:14px;font-size:9px">4</span> Four</span>
    <span class="leg-item"><span class="run-badge run-6" style="width:14px;height:14px;font-size:9px">6</span> Six</span>
  </div>`;

  const stats=`<div class="stats-row">
    <span class="stat-item">Total: <b>${runs}/${wkts}</b></span>
    <span class="stat-item">Extras: <b>${extras}</b></span>
    <span class="stat-item">Wides: <b style="color:#c4b5fd">${wides}</b></span>
    <span class="stat-item">No Balls: <b style="color:#fcd34d">${noballs}</b></span>
    <span class="stat-item">Fours: <b style="color:#60a5fa">${fours}</b></span>
    <span class="stat-item">Sixes: <b style="color:#a78bfa">${sixes}</b></span>
  </div>`;

  return`<div class="innings-block">
    <div class="innings-summary">
      <span class="inn-team">🏏 ${teamName}</span>
      <span class="inn-score-big">${runs}/${wkts}</span>
    </div>
    ${targetBanner}${stats}${legend}
    ${overNums.map(o=>renderOverAccordion(overs[o],o)).join('')}
  </div>`;
}

function renderOverAccordion(balls,overNum){
  const totalRuns=balls.reduce((s,b)=>s+b.r,0);
  const wkts=balls.filter(b=>b.wk).length;
  const bowler=balls.find(b=>b.t==='normal'||b.t==='noball')?.bw||balls[0]?.bw||'—';
  const extrasList=[...new Set(balls.filter(b=>b.ex).map(b=>b.ex))].join(', ');
  const key=`ov_${overNum}`;
  const isOpen=!!openOvers[key];
  return`<div class="over-accordion">
    <div class="over-header${isOpen?' open':''}" onclick="toggleOver('${key}',this)">
      <span class="over-num">Over ${overNum}</span>
      <span class="over-runs">${totalRuns} runs</span>
      <span class="over-bowler">🎯 ${bowler}</span>
      ${extrasList?`<span class="over-extras-info">⚡ ${extrasList}</span>`:''}
      ${wkts?`<span class="over-wkts">🔴 ${wkts}W</span>`:''}
      <span class="chevron">▼</span>
    </div>
    <div id="${key}" style="display:${isOpen?'block':'none'}">${renderBallsTable(balls)}</div>
  </div>`;
}

function toggleOver(key,hdr){
  const el=document.getElementById(key);
  const isOpen=el.style.display!=='none';
  el.style.display=isOpen?'none':'block';
  hdr.classList.toggle('open',!isOpen);
  openOvers[key]=!isOpen;
}

function runBadge(b){
  if(b.wk)return`<span class="run-badge run-w">W</span>`;
  const r=b.br;
  const cls=r===4?'run-4':r===6?'run-6':r===0?'run-0':r===3?'run-3':'run-'+(r<=2?r:2);
  return`<span class="run-badge ${cls}">${r}</span>`;
}

function extrasTag(b){
  if(!b.ex)return'';
  if(b.t==='noball')return`<span class="nb-tag">${b.ex}</span>`;
  if(b.t==='wide')return`<span class="wd-tag">${b.ex}</span>`;
  return'';
}

function renderBallsTable(balls){
  const rows=balls.map(b=>{
    let rowClass='normal-row';
    if(b.wk)rowClass='wicket-row';
    else if(b.t==='noball')rowClass='noball-row';
    else if(b.t==='wide')rowClass='wide-row';
    else if(b.fh)rowClass='freehit-row';
    const ballLabel=b.t==='wide'?'Wd':b.t==='noball'?'NB':String(b.b);
    const fhTag=b.fh?`<span class="fh-tag">FREE HIT</span>`:'';
    const wkTag=b.wk?`<span class="wk-tag">${b.wk}${b.ob?' — '+b.ob:''}</span>`:'';
    const dismissed=b.d?`<br><span style="font-size:11px;color:#fca5a5">Out: ${b.d}</span>`:'';
    const scReason=b.sc?`<span class="sc-reason">${b.sc}</span>`:'';
    const ocReason=b.oc?`<br><span class="oc-reason">${b.oc}</span>`:'';
    return`<tr class="${rowClass}">
      <td style="text-align:center;font-weight:700;color:#3b82f6">${ballLabel}</td>
      <td>${runBadge(b)} ${extrasTag(b)} ${fhTag}</td>
      <td>${b.s}</td>
      <td>${b.ns}</td>
      <td>${b.bw}</td>
      <td style="text-align:center;font-weight:700;color:#94a3b8">${b.cu}/${b.cw}</td>
      <td>${wkTag}${dismissed}</td>
      <td>${scReason}${ocReason}</td>
    </tr>`;
  }).join('');
  return`<div class="balls-table-wrap">
    <table class="balls-table">
      <thead><tr>
        <th>Ball</th><th>Runs</th><th>Striker</th><th>Non-Striker</th>
        <th>Bowler</th><th>Score</th><th>Wicket / Dismissal</th><th>Striker Change Reason</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}
</script>
</body>
</html>
